[project]
name = "sekretariat"
version = "0.1.0"
description = "Domowy Sekretariat: triage of official letters by household rules"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143",
    "google-auth>=2.61",
    "google-cloud-dlp>=3.40",
    "google-cloud-documentai>=3.16",
    "google-cloud-firestore>=2.34",
    "google-cloud-secret-manager>=2.31",
    "google-cloud-storage>=3.17",
    "google-cloud-tasks>=2.26",
    "google-genai>=2.29",
    "itsdangerous>=2.2",
    "jinja2>=3.1.6",
    "pydantic>=2.14",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "requests>=2.32",
    "uvicorn>=0.54",
]

[dependency-groups]
dev = [
    "axe-playwright-python>=0.1.8",
    "httpx2>=2.13.1",
    "pillow>=11",
    "pre-commit>=4.6",
    "pytest>=9.1",
    "pytest-playwright>=0.10.0",
    "ruff>=0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sekretariat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: calls real GCP APIs; needs GCLOUD_CONFIGURATION and GCP_PROJECT",
    "e2e: phone-sized browser tests; needs `uv run playwright install webkit`",
]
addopts = "-m 'not integration and not e2e' --browser webkit"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # one table row per case reads better than wrapped rows
