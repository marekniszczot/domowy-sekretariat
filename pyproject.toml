[project]
name = "sekretariat"
version = "0.1.0"
description = "Domowy Sekretariat: triage of official letters by household rules"
requires-python = ">=3.13"
dependencies = [
    "google-cloud-dlp>=3.40",
]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "ruff>=0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sekretariat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: calls real GCP APIs; needs GCLOUD_CONFIGURATION and GCP_PROJECT",
]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
