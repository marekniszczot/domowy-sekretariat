{% extends "base.html" %}
{% block head %}<script src="https://accounts.google.com/gsi/client" async></script>{% endblock %}
{% block content %}
<div class="signin">
  <h1 class="title">Domowy Sekretariat</h1>
  <p class="lede">Zrób zdjęcie pisma z banku, urzędu albo od dostawcy prądu. Powiem, o co chodzi i czy trzeba coś zrobić.</p>
  <div id="g_id_onload" data-client_id="{{ client_id }}" data-ux_mode="redirect"
       data-login_uri="{{ login_uri }}" data-auto_prompt="false"></div>
  <div class="g_id_signin" data-type="standard" data-size="large" data-text="signin_with"
       data-shape="rectangular" data-locale="pl" data-width="320"></div>
</div>
{% endblock %}
