# Fictional household. Copy to household.yaml (ignored by git) and fill in your own.
#
# Order matters: the n-th member becomes OSOBA_n in everything sent to the model.
# role: koordynator (sees and configures everything), domownik (has an account),
#       bez_konta (no account; masked and covered by rules, reminders go to the koordynator).
# emails: any of them may sign in; reminders go to the first one. Optional for bez_konta.
# first_name_forms / surname_forms: every spelling that may appear in a letter,
#       inflected forms included. Matched as whole words, case-insensitive. Masking
#       combines them in both orders ("Jan Przykładowy", "Przykładowy, Jan"), so do
#       not list combinations. A surname shared by several members is allowed: alone
#       it becomes OSOBA_DOMU. First name forms must be unique across the household.
# display_name: optional, how the app shows the member ("Babcia Zosia"); defaults to
#       the first of first_name_forms, so list the nominative first.
# address_forms: optional, the home address as letters write it: street with number
#       in each case, postal code. Masked as [ADRES] in any case, also without "ul.".
# name_cases: optional, the display name in other cases, so the card reads
#       "dla Ewy", not "dla Ewa": dopelniacz, celownik, biernik, narzednik,
#       miejscownik, wolacz. A missing case shows the nominative.
members:
  - id: ewa
    role: domownik
    emails: [ewa@example.com]
    first_name_forms: [Ewa, Ewy, Ewie, Ewę, Ewą, Ewo]
    surname_forms: [Przykładowa, Przykładowej, Przykładową]
    address_forms: [Lipowa 7, Lipowej 7, 00-001]
    name_cases: {dopelniacz: Ewy, celownik: Ewie, biernik: Ewę, narzednik: Ewą, miejscownik: Ewie, wolacz: Ewo}

  - id: jan
    role: koordynator
    emails: [jan@example.com, jan.drugi@example.com]
    first_name_forms: [Jan, Jana, Janowi, Janem, Janie]
    surname_forms: [Przykładowy, Przykładowego, Przykładowemu, Przykładowym]
    address_forms: [Lipowa 7, Lipowej 7, 00-001]
    name_cases: {dopelniacz: Jana, celownik: Janowi, biernik: Jana, narzednik: Janem, miejscownik: Janie, wolacz: Janie}

  - id: zofia
    role: bez_konta
    display_name: Babcia Zosia
    first_name_forms: [Zofia, Zofii, Zofię, Zofią, Zofio]
    surname_forms: [Wzorcowa, Wzorcowej, Wzorcową]
    address_forms: [Klonowa 15, Klonowej 15, 00-002]
    name_cases: {dopelniacz: Babci Zosi, celownik: Babci Zosi, biernik: Babcię Zosię, narzednik: Babcią Zosią, miejscownik: Babci Zosi, wolacz: Babciu Zosiu}
