name: eval

# Model evaluation gate (D12): python -m sekretariat.eval on every pull request that
# can change the analysis. Only pull requests from this repository: the `eval`
# environment identity can call the models, and forks never get it.
on:
  pull_request:
    paths:
      - "sekretariat/**"
      - "eval/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/eval.yml"

concurrency:
  group: eval-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  eval:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: eval
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_EVAL_SERVICE_ACCOUNT }}

      - uses: astral-sh/setup-uv@v6

      - run: uv sync --frozen

      - id: eval
        continue-on-error: true
        env:
          GCP_PROJECT: ${{ vars.GCP_PROJECT_ID }}
        run: uv run python -m sekretariat.eval --report report.md --out runs.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval
          path: |
            report.md
            runs.json

      - name: Comment on the pull request
        if: always() && hashFiles('report.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh pr comment ${{ github.event.pull_request.number }}
          --body-file report.md --edit-last --create-if-none

      - if: steps.eval.outcome == 'failure'
        run: exit 1
