- id: podatek-formulka-spadek
  delivery_date: 2026-02-04
  tags: [boilerplate]
  expected: {verdict: SELF, rule_id: R3, deadline: 2026-03-15, addressee: jan, sender_type: URZAD}
  text: |
    PREZYDENT MIASTA PRZYKŁADOWO
    Wydział Podatków i Opłat
    Przykładowo, dnia 21-01-2026 r.

    Pan Jan Przykładowy
    ul. Lipowa 7 m. 3, 81-001 Przykładowo

    DECYZJA nr PN.3120.5120.2026
    w sprawie wymiaru podatku od nieruchomości na 2026 rok

    Ustala się wysokość podatku od nieruchomości na 2026 rok w kwocie 96,00 zł,
    płatnego w ratach po 24,00 zł do: 15-03-2026, 15-05-2026, 15-09-2026, 15-11-2026.

    W przypadku, gdy podatnik nie złoży w terminie informacji o nieruchomościach,
    organ podatkowy ustala wysokość podatku na podstawie aktu notarialnego, aktu
    poświadczenia dziedziczenia, postanowienia sądu o nabyciu spadku lub danych
    z ewidencji gruntów i budynków.

    Od decyzji służy odwołanie do Samorządowego Kolegium Odwoławczego w terminie
    14 dni od dnia jej doręczenia.

